[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eitkit"
version = "0.2.0"
description = "A modular Python toolkit for 2-D Electrical Impedance Tomography: FEM forward simulation, adjoint Jacobians, and Tikhonov and total-variation reconstruction."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Abd'gafar Tunde Tiamiyu", email = "abdgafartunde@yahoo.com" }
]
requires-python = ">=3.10"
keywords = ["electrical impedance tomography", "EIT", "inverse problems", "finite element method", "regularization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "nbclient>=0.10",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/abdgafartunde/eit-reconstruction-toolkit"
Documentation = "https://github.com/abdgafartunde/eit-reconstruction-toolkit/blob/main/THEORY.md"
DOI = "https://doi.org/10.5281/zenodo.21037312"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["eitkit"]

# ---------------------------------------------------------------------------
# Ruff  (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "examples/",   # demo notebooks — not held to library lint standards
    "scripts/",    # dev/verification scripts
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",    # line-length handled by formatter
    "N802",    # function names with uppercase (assemble_K, test_..._dV) — scientific convention
    "N803",    # uppercase argument names — scientific convention
    "N806",    # uppercase variables (J, K, dV) — scientific convention
    "N816",    # mixedCase variables (dV_clean) — scientific convention
    "SIM108",  # ternary operator suggestions — reduce readability in numeric code
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
